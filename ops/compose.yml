# Cassandra 5 for mailroom-archive. Always run as project "mailroom-archive" (scripts/vm.sh).
# Profiles: single (1 node, RF 1), small (3 nodes, low memory), full (3 nodes).
# ARCHIVE_ENV picks ops/cassandra/<env>.env, ARCHIVE_MEM the per-node memory limit.
x-node: &node
  image: cassandra:5.0
  env_file: cassandra/${ARCHIVE_ENV:-small}.env
  environment:
    CASSANDRA_SEEDS: cassandra-1
    CASSANDRA_CLUSTER_NAME: mailroom-archive
    JVM_EXTRA_OPTS: -Dcassandra.skip_wait_for_gossip_to_settle=0
  mem_limit: ${ARCHIVE_MEM:-1200m}
  restart: unless-stopped

services:
  cassandra-1:
    <<: *node
    profiles: [single, small, full]
    ports: ["127.0.0.1:9042:9042"]
    volumes: [data-1:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool status 2>/dev/null | grep -c '^UN') -ge 1 ]"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Nodes join one at a time: Cassandra refuses concurrent bootstraps.
  cassandra-2:
    <<: *node
    profiles: [small, full]
    volumes: [data-2:/var/lib/cassandra]
    depends_on: {cassandra-1: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool status 2>/dev/null | grep -c '^UN') -ge 2 ]"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  cassandra-3:
    <<: *node
    profiles: [small, full]
    volumes: [data-3:/var/lib/cassandra]
    depends_on: {cassandra-2: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool status 2>/dev/null | grep -c '^UN') -ge 3 ]"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  data-1:
  data-2:
  data-3:
